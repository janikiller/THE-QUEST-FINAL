<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE QUEST FINAL — Eventos en la ciudad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="events.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">TQ</span>
      <div>
        <p class="brand-name">THE QUEST FINAL</p>
        <p class="brand-sub">Centralita · Eventos en la ciudad</p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-random" class="btn primary">Despachar aleatorio</button>
      <button type="button" id="btn-clear" class="btn ghost">Limpiar activos</button>
    </div>
  </header>

  <main class="layout">
    <section class="board">
      <div class="board-head">
        <div>
          <h1>Eventos en la ciudad</h1>
          <p class="lede">Una ciudad viva, llena de historias. Cada día es diferente.</p>
        </div>
        <p class="mission">Misión: hacer una ciudad más segura</p>
      </div>

      <div class="filters" id="filters" role="tablist" aria-label="Categorías"></div>
      <div class="event-grid" id="event-grid"></div>
    </section>

    <aside class="dispatch">
      <section class="selected" id="selected-panel">
        <p class="eyebrow">Seleccionado</p>
        <div class="selected-art" id="selected-art"></div>
        <h2 id="selected-title">Elige un evento</h2>
        <p id="selected-meta" class="meta">70 escenarios listos para el juego</p>
        <dl class="stats" id="selected-stats"></dl>
        <div class="cta-row">
          <button type="button" id="btn-dispatch" class="btn primary" disabled>Despachar</button>
          <button type="button" id="btn-weather" class="btn ghost" disabled>Aplicar clima</button>
        </div>
      </section>

      <section class="active-box">
        <div class="active-head">
          <h2>Activos</h2>
          <span class="pill" id="active-count">0</span>
        </div>
        <p class="weather-line" id="weather-line">Clima: Día soleado</p>
        <ul class="active-list" id="active-list"></ul>
      </section>
    </aside>
  </main>

  <script type="module" src="events-app.js"></script>
</body>
</html>
